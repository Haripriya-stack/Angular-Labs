<h1 *ngIf="showHeading"> portfolio </h1>
<ng-container *ngIf="!submitted; else preview">
   
    <h2>Personal Information</h2>
    <form>
      
    <div>
        <label for="name" >Name:</label>
        <input type="text" name="name" id="name" value="" [(ngModel)]="nm"/>
    </div>
    <div>
        <label for="email">Email:</label>
        <input type="email"name="email"  id="email" value="" [(ngModel)]="em"/>
    </div>
    <div>
        <label for="phone">Phone:</label>
        <input type="tel" name="phone"  id="phone" value="" [(ngModel)]="ph"/>
    </div>
    <div>
        <label for="address">Address:</label>
        <input type="text" name="address" id="address" value="" [(ngModel)]="add"/>
    </div>

    </form>
     
    <h2>Qualification</h2>
    <div>
    <form *ngFor="let q of qualification; let i=index">
        <h3>Qualification {{i+1}}</h3>
        <div>
            <label for="School">School/College:</label>
            <input type="text" name="School" id="School" value="" [(ngModel)]="q.school"/>
        </div>
        <div>
            <label for="degree">Degree:</label>
            <input type="text"  name="degree" id="degree" value="" [(ngModel)]="q.degree"/>
        </div>
        <div>
            <label for="year">Year of Graduation:</label>
            <input type="text"  name="year" id="year" value="" [(ngModel)]="q.year"/>
        </div>
    </form>
    </div>
  <div class="btn-container">
    <button type="submit" (click)="formSubmit()">Submit</button>
    <button type="reset">Reset</button>
    <button type="button" (click)="addQualification()">Add Qualification</button>
</div>

</ng-container>


<ng-template #preview>
    
  <div class="preview-container">

    <h2>Preview</h2>
    <div>
    <p>Name: {{nm}}</p>
    <p>Email:{{em}} </p>
    <p>Phone: {{ph}}</p>
    <p>Address: {{add}}</p> 
    </div>   
    <h3>Qualifications</h3>
    <div *ngFor="let q of qualification">
    <p>School/College: {{q.school}}</p>
    <p>Degree:{{q.degree}} </p>
    <p>Year of Graduation:{{q.year}} </p>
    </div>
   
    <button  class="btn-edit" (click)="formEdit()">Edit</button>
   </div>
</ng-template>
